name: PHP checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  php:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, curl
      - name: Lint
        shell: bash
        run: find . -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 php -l 2>&1 | tee "$RUNNER_TEMP/qualpacote-php-lint.txt"
      - name: Recommendation engine tests
        shell: bash
        run: |
          {
            php tests/RecommendationEngineTest.php || exit $?
            php tests/RestrictionIntelligenceTest.php || exit $?
            php tests/SourceDocumentTest.php || exit $?
          } 2>&1 | tee "$RUNNER_TEMP/qualpacote-php-unit.txt"
      - name: Usage statistics integration tests
        shell: bash
        env:
          QUALPACOTE_TEST_DSN: "mysql:host=127.0.0.1;port=3306;charset=utf8mb4"
          QUALPACOTE_TEST_USER: root
          QUALPACOTE_TEST_PASSWORD: test-password
        run: |
          {
            php tests/UsageStatisticsTest.php || exit $?
            php tests/CatalogIntegrationTest.php || exit $?
          } 2>&1 | tee "$RUNNER_TEMP/qualpacote-php-integration.txt"
      - name: Preserve public test evidence in Git
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVIDENCE_STATUS: ${{ job.status }}
        run: python3 tools/intelligence/ci.py --name php-checks --status "$EVIDENCE_STATUS" --publish
